codecov:
  # The four test jobs each upload a report. Holding the status back until all of
  # them land keeps a half-merged number from posting — and, with these statuses
  # required for merge, from flapping red and then green on every PR.
  notify:
    after_n_builds: 4
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        # Line coverage is ~97% as of 2026-07-25. A fixed floor below that catches a
        # real regression while, unlike `target: auto`, not resetting to whatever the
        # base commit happened to be — coverage can't quietly erode PR by PR.
        target: 95%
        threshold: 1%
        # A PR that touches no PHP has no base to compare against on a fresh repo;
        # without this the status never turns green and auto-merge stalls forever.
        if_not_found: success
    patch:
      default:
        # Newly-changed lines are expected to come close to full coverage; the
        # threshold keeps one uncovered guard clause from failing the whole patch.
        target: 90%
        threshold: 1%
        if_not_found: success

comment:
  layout: diff, files
  require_changes: true

ignore:
  - tests
