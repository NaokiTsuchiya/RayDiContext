# Mago configuration — strictest settings: every analyzer strictness flag is on,
# every applicable linter rule is enabled (rules gated on PHP >= 8.4 or on unused
# framework integrations are unavailable by definition), and any issue of any
# level ("note" is the lowest) fails both lint and analyze.

php-version = "8.2"

[source]
paths = ["src", "tests"]
includes = ["vendor"]
excludes = ["tests/tmp", "tests/Fixture", "tests/dist"]

[linter]
integrations = ["phpunit"]
minimum-fail-level = "note"

[linter.rules]
ambiguous-constant-access = { enabled = true }
ambiguous-function-call = { enabled = true }
disallowed-type-instantiation = { enabled = true }
method-name = { enabled = true }
no-redundant-else = { enabled = true }
no-redundant-variable = { enabled = true }
no-dead-store = { enabled = true }
no-unused-static = { enabled = true }
no-unused-global = { enabled = true }
no-unused-closure-capture = { enabled = true }
no-negated-ternary = { enabled = true }
no-is-null = { enabled = true }
no-iterator-to-array-in-foreach = { enabled = true }
no-assign-in-argument = { enabled = true }
no-fully-qualified-global-class-like = { enabled = true }
no-fully-qualified-global-constant = { enabled = true }
no-fully-qualified-global-function = { enabled = true }
prefer-early-return = { enabled = true }
variable-name = { enabled = true, camel = true }
no-array-accumulation-in-loop = { enabled = true }
prefer-array-spread = { enabled = true }
no-parameter-shadowing = { enabled = true }
no-inline = { enabled = true }
no-side-effects-with-declarations = { enabled = true }
property-name = { enabled = true }
require-namespace = { enabled = true }
sorted-integer-keys = { enabled = true }
string-style = { enabled = true }
yoda-conditions = { enabled = true, mode = "deny" }
no-literal-namespace-string = { enabled = true }
no-short-bool-cast = { enabled = true }
no-alternative-syntax = { enabled = true }
prefer-self-return-type = { enabled = true }
switch-continue-to-break = { enabled = true }
missing-docs = { enabled = true }
no-null-property-init = { enabled = true }
prefer-explode-over-preg-split = { enabled = true }
prefer-test-attribute = { enabled = true }
class-name = { enabled = true, psr = true }

[analyzer]
minimum-fail-level = "note"
# PHPUnit assertion failures are the framework's control flow; they are the only
# exceptions treated as unchecked. Package exceptions remain fully checked.
# Listed one by one rather than by base class: matching here is exact, so
# SkippedWithMessageException needs naming even though it extends AssertionFailedError.
unchecked-exception-classes = [
    "PHPUnit\\Framework\\Exception",
    "PHPUnit\\Framework\\AssertionFailedError",
    "PHPUnit\\Framework\\ExpectationFailedException",
    "PHPUnit\\Framework\\UnknownClassOrInterfaceException",
    "PHPUnit\\Framework\\SkippedWithMessageException",
]
# PHPUnit initializes fixtures in setUp(), not in the constructor.
class-initializers = ["setUp"]
find-overly-wide-return-types = true
analyze-dead-code = true
check-throws = true
strict-list-index-checks = true
strict-array-index-existence = true
no-boolean-literal-comparison = true
check-missing-type-hints = true
check-closure-missing-type-hints = true
check-arrow-function-missing-type-hints = true
check-missing-override = true
find-unused-parameters = true
check-property-initialization = true
check-use-statements = true
check-experimental = true
check-name-casing = true
enforce-class-finality = true
require-api-or-internal = true
allow-side-effects-in-conditions = false

# The package's exception contract, enforced at the declaration site rather than by a test.
# ExceptionInterface claims to mark every exception this package throws; these rules are what
# make that true, so `catch (ExceptionInterface)` cannot silently start missing a case.
[[guard.structural.rules]]
on = 'NaokiTsuchiya\RayDiContext\Exception\*'
not-on = 'NaokiTsuchiya\RayDiContext\Exception\AbstractRuntimeException'
target = "class"
must-be-final = true
must-extend = 'NaokiTsuchiya\RayDiContext\Exception\AbstractRuntimeException'
reason = "Concrete exceptions are final and inherit the marker from AbstractRuntimeException"

[[guard.structural.rules]]
on = 'NaokiTsuchiya\RayDiContext\Exception\ExceptionInterface'
target = "interface"
must-extend = 'Throwable'
reason = "`catch (ExceptionInterface $e)` is the documented entry point; without Throwable that $e has no getMessage()"

[[guard.structural.rules]]
on = 'NaokiTsuchiya\RayDiContext\Exception\AbstractRuntimeException'
target = "class"
must-be-abstract = true
must-implement = 'NaokiTsuchiya\RayDiContext\Exception\ExceptionInterface'
must-extend = 'RuntimeException'
reason = "The base carries both the marker and the \\RuntimeException lineage every subclass relies on"

# Root-namespace concrete classes are final; AbstractContext and AbstractCompiledContext are the
# sole abstract exceptions.
[[guard.structural.rules]]
on = 'NaokiTsuchiya\RayDiContext\*'
not-on = 'NaokiTsuchiya\RayDiContext\Abstract{Context,CompiledContext}'
target = "class"
must-be-final = true
reason = "Every concrete class in the root namespace is final except AbstractContext and AbstractCompiledContext, which exist to be extended"

# mago lint's class-name/interface-name rules only check PSR casing, not this package's *Interface suffix convention.
[[guard.structural.rules]]
on = 'NaokiTsuchiya\RayDiContext\*'
target = "interface"
must-be-named = '*Interface'
reason = "Every interface in this package is named with an Interface suffix"

# AppMeta's readonly-ness is the core of its "pure value object" design (see #29); guard it structurally.
[[guard.structural.rules]]
on = 'NaokiTsuchiya\RayDiContext\AppMeta'
target = "class"
must-be-readonly = true
reason = "AppMeta is a pure value object; losing readonly would silently break that guarantee"

# Keep the Exception namespace free of enums/functions that would blur its declaration-only purpose.
[[guard.structural.rules]]
on = 'NaokiTsuchiya\RayDiContext\Exception\*'
must-be = ["class", "interface"]
reason = "The Exception namespace holds only exception classes and the marker interface"
